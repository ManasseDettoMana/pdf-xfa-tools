name: CI

on:
  push:
    branches: [master, "feature/**"]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  test:
    # Windows is the only target platform, and the Word COM path plus the
    # default engine detection only make sense here.
    runs-on: windows-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Lint
        run: python -m ruff check .

      - name: Run tests
        env:
          # No display on the runner; Qt widgets still construct and behave.
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q

      - name: Report detected engines
        # Informational: shows what the runner had available, which explains any
        # skipped engine-dependent tests.
        run: python -m xfatools.cli doctor
